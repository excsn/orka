[package]
name = "orka"
version = "0.3.0"
edition.workspace = true
authors = ["Excerion Sun <dev@excsn.com>"]
license = "MPL-2.0"

description = "An asynchronous, pluggable, and type-safe workflow engine for Rust, designed for orchestrating complex multi-step business processes."
readme = "README.md"
homepage = "https://github.com/excsn/orka"
repository = "https://github.com/excsn/orka"
keywords = ["workflow", "pipeline", "async", "orchestration", "state-machine"]
categories = ["asynchronous", "concurrency", "rust-patterns"]

[dependencies]
anyhow = "^1.0"
thiserror = "^2.0"
async-trait = "^0.1.77"
tracing = "^0"
parking_lot = "^0"
serde = { version = "1", features = ["derive"], optional = true }
tokio = { version = "1", default-features = false, features = ["rt", "time"], optional = true }

[features]
test-util = []           # orka::test_util
serde = ["dep:serde"]    # Serialize on trace and plan types
tokio = ["dep:tokio"]    # TokioSpawner, timed

[dev-dependencies]
orka = { path = ".", features = ["test-util", "tokio"] }   # self-dep: bare `cargo test` gets the features
criterion = { version = "0.5", features = ["async_tokio"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
once_cell = "1.10"

[lib]
name = "orka"
path = "src/lib.rs"

[[bench]]
name = "orka_benchmarks"
harness = false